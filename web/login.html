<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · 积分超市管理后台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--brand:#c2410c;--brand-d:#9a3412;--ink:#1f2937;--muted:#6b7280;--line:#ece5dd}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;color:var(--ink);
  min-height:100vh;display:grid;place-items:center;padding:20px;
  background:radial-gradient(900px 500px at 10% -10%,#fff1e6 0%,transparent 60%),
             radial-gradient(800px 480px at 100% 0%,#fff8e1 0%,transparent 55%),#f8f6f3}
.card{width:100%;max-width:380px;background:#fff;border:1px solid var(--line);border-radius:18px;
  padding:30px 26px 26px;box-shadow:0 16px 44px rgba(120,60,10,.12)}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.logo .ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:20px;
  background:linear-gradient(130deg,#9a3412,#c2410c 60%,#d4a017);color:#fff}
h1{font-size:18px;font-weight:800;letter-spacing:.5px}
.sub{font-size:12.5px;color:var(--muted);margin:6px 0 20px}
label{display:block;margin-bottom:13px}
label span{display:block;font-size:12.5px;color:#57534e;margin-bottom:6px;font-weight:600}
input{width:100%;height:42px;border:1px solid var(--line);border-radius:11px;background:#fbfaf8;
  padding:0 12px;font-size:14px;font-family:inherit;outline:none;transition:.15s}
input:focus{border-color:#f0b58c;background:#fff;box-shadow:0 0 0 3px #fff1e6}
button{width:100%;height:43px;border:none;border-radius:11px;font-family:inherit;font-size:14.5px;
  font-weight:700;color:#fff;cursor:pointer;background:linear-gradient(120deg,#9a3412,#c2410c);
  box-shadow:0 8px 20px rgba(194,65,12,.22);margin-top:4px}
button:disabled{opacity:.6;cursor:default}
.err{color:#b91c1c;font-size:12.5px;min-height:18px;margin-top:10px;line-height:1.5}
.foot{margin-top:18px;text-align:center;font-size:12px;color:var(--muted);line-height:1.8}
.foot a{color:var(--brand);font-weight:600;text-decoration:none}
</style>
</head>
<body>
<form class="card" id="form" autocomplete="off">
  <div class="logo"><div class="ic">🏪</div><h1>积分超市 · 管理后台</h1></div>
  <p class="sub">乡村振兴积分制 · 商品兑换与积分管理</p>
  <label><span>用户名</span><input id="username" name="username" placeholder="请输入用户名" autofocus></label>
  <label><span>密码</span><input id="password" name="password" type="password" placeholder="请输入密码"></label>
  <button id="btn" type="submit">登 录</button>
  <div class="err" id="err"></div>
  <div class="foot">
    <a href="./jifen.html">← 返回村民端</a><br>
    忘记密码？请让管理员在服务器执行 <code>python tools/reset_pwd.py</code>
  </div>
</form>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var next = q.get('next') || '/jifen-admin.html';
  if (next.charAt(0) !== '/' || next.indexOf('//') === 0) next = '/jifen-admin.html';
  fetch('/api/auth/me', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (d) {
    if (d && d.success) location.replace(next);
  }).catch(function () {});
  document.getElementById('form').onsubmit = function (e) {
    e.preventDefault();
    var u = document.getElementById('username').value.trim();
    var p = document.getElementById('password').value;
    var err = document.getElementById('err'), btn = document.getElementById('btn');
    if (!u || !p) { err.textContent = '请填写用户名和密码'; return; }
    btn.disabled = true; err.textContent = '';
    fetch('/api/auth/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: u, password: p })
    }).then(function (r) { return r.json().then(function (d) { return { s: r.status, d: d }; }); })
      .then(function (x) {
        btn.disabled = false;
        if (x.d && x.d.success) { location.replace(next); return; }
        err.textContent = (x.d && x.d.error) || '登录失败（HTTP ' + x.s + '）';
        document.getElementById('password').value = '';
        document.getElementById('password').focus();
      })
      .catch(function () { btn.disabled = false; err.textContent = '网络异常，请稍后重试'; });
  };
})();
</script>
</body>
</html>
